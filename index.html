<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tólinhas — Menu do Dia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap');
  :root{
    --cream:#f5f0e8; --dark:#1a1208; --gold:#c9a84c;
    --gold-light:#e8c97a; --muted:#7a6a52; --white:#fffdf8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Jost',sans-serif;background:var(--dark);min-height:100vh;}

  /* ── LANG PAGE ── */
  #page-lang{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 20px; position:relative; overflow:hidden;
  }
  #page-lang::before{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 25% 20%,rgba(201,168,76,.15) 0%,transparent 55%),
      radial-gradient(ellipse at 80% 85%,rgba(201,168,76,.09) 0%,transparent 50%);
    pointer-events:none;
  }
  .lang-card{
    background:rgba(255,253,248,.04); border:1px solid rgba(201,168,76,.25);
    border-radius:24px; padding:52px 44px 48px; max-width:460px; width:100%;
    text-align:center; backdrop-filter:blur(12px);
    animation:fadeUp .8s ease both; position:relative; z-index:1;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
  .ornament{color:var(--gold);font-size:10px;letter-spacing:7px;text-transform:uppercase;margin-bottom:14px;opacity:.65;}
  .brand{font-family:'Libre Baskerville',serif;font-style:italic;text-transform:uppercase;font-size:clamp(2.4rem,7vw,3.4rem);color:var(--white);line-height:1.05;letter-spacing:3px;margin-bottom:6px;}
  .brand-sub{color:var(--gold);font-size:11px;letter-spacing:5px;text-transform:uppercase;font-weight:300;margin-bottom:36px;}
  .divider{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 34px;}
  .lang-label{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
  .lang-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .lang-btn{
    background:rgba(255,253,248,.05); border:1px solid rgba(201,168,76,.28);
    border-radius:14px; padding:22px 10px; cursor:pointer; transition:all .3s;
    color:var(--white); font-family:'Playfair Display',serif; font-size:1.1rem;
    letter-spacing:1px;
  }
  .lang-btn:hover{background:rgba(201,168,76,.13);border-color:var(--gold);transform:translateY(-3px);box-shadow:0 10px 28px rgba(201,168,76,.18);}

  /* ── MENU PAGE ── */
  #page-menu{display:none;min-height:100vh;flex-direction:column;background:#0e0d0b;}
  #page-menu.active{display:flex;}
  .menu-topbar{
    background:var(--dark); border-bottom:1px solid rgba(201,168,76,.22);
    padding:13px 20px; display:flex; align-items:center; justify-content:space-between;
    gap:12px; position:sticky; top:0; z-index:10;
  }
  .back-btn{
    background:rgba(255,253,248,.07); border:1px solid rgba(201,168,76,.3);
    color:var(--gold); padding:8px 18px; border-radius:8px; cursor:pointer;
    font-family:'Jost',sans-serif; font-size:13px; letter-spacing:1px;
    transition:all .3s; white-space:nowrap;
  }
  .back-btn:hover{background:rgba(201,168,76,.15);}
  .topbar-center{flex:1;text-align:center;}
  .topbar-title{font-family:'Playfair Display',serif;color:var(--white);font-size:1.1rem;letter-spacing:1px;}
  .topbar-date{font-size:11px;color:var(--gold);letter-spacing:2px;opacity:.7;margin-top:2px;}
  .topbar-flag{font-size:22px;}
  .pdf-wrap{
    flex:1; display:flex; flex-direction:column;
    align-items:stretch; padding:24px 16px 40px;
    max-width:860px; width:100%; margin:0 auto;
  }
  .menu-img{
    width:100%; height:auto;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    display:block;
  }
</style>
</head>
<body>

<!-- LANGUAGE SELECTOR -->
<div id="page-lang">
  <div class="lang-card">
    <div class="ornament">✦ &nbsp; restaurante &nbsp; ✦</div>
    <h1 class="brand">Tólinhas</h1>
    <p class="brand-sub">menu do dia</p>
    <div class="divider"></div>
    <p class="lang-label">escolha a sua língua</p>
    <div class="lang-grid">
      <button class="lang-btn" onclick="openMenu('pt')">Português</button>
      <button class="lang-btn" onclick="openMenu('fr')">Français</button>
      <button class="lang-btn" onclick="openMenu('en')">English</button>
    </div>
  </div>
</div>

<!-- MENU VIEWER -->
<div id="page-menu">
  <div class="menu-topbar">
    <button class="back-btn" onclick="goBack()">← Voltar</button>
    <div class="topbar-center">
      <div class="topbar-title">Tólinhas</div>
      <div id="menu-date" class="topbar-date"></div>
    </div>
    <span id="menu-flag" class="topbar-flag"></span>
  </div>
  <div class="pdf-wrap">
    <img id="menu-img" class="menu-img" src="" alt="Menu">
  </div>
</div>

<script>
const FLAGS   = { pt:'🇵🇹', fr:'🇫🇷', en:'🇬🇧' };
const LOCALES = { pt:'pt-PT', fr:'fr-FR', en:'en-GB' };
// Imagens devem ser carregadas com estes nomes exactos:
//   menu-pt.png  /  menu-fr.png  /  menu-en.png
const base = window.location.href.replace(/\/[^/]*$/, '').replace(/\/index\.html$/, '');
const IMGS = { pt: base+'/menu-pt.png', fr: base+'/menu-fr.png', en: base+'/menu-en.png' };

function openMenu(lang) {
  document.getElementById('menu-flag').textContent = FLAGS[lang];
  document.getElementById('menu-date').textContent =
    new Date().toLocaleDateString(LOCALES[lang],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('menu-img').src = IMGS[lang];
  document.getElementById('page-lang').style.display = 'none';
  document.getElementById('page-menu').classList.add('active');
  window.scrollTo(0,0);
}

function goBack() {
  document.getElementById('page-menu').classList.remove('active');
  document.getElementById('page-lang').style.display = 'flex';
  document.getElementById('menu-img').src = '';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
