<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tólinhas — QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap');

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Jost',sans-serif;
    background:#f5f0e8;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }

  .card{
    background:#fffdf8;
    border:2px solid #c9a84c;
    border-radius:20px;
    padding:48px 44px 40px;
    max-width:380px; width:100%;
    text-align:center;
    box-shadow:0 8px 40px rgba(26,18,8,.12);
  }

  .top-ornament{
    color:#c9a84c; font-size:10px; letter-spacing:7px;
    text-transform:uppercase; margin-bottom:16px; opacity:.7;
  }

  .brand{
    font-family:'Playfair Display',serif;
    font-size:3rem; color:#1a1208;
    letter-spacing:3px; line-height:1; margin-bottom:4px;
  }

  .brand-italic{
    font-family:'Playfair Display',serif;
    font-style:italic; font-size:1rem;
    color:#c9a84c; letter-spacing:3px;
    margin-bottom:28px; font-weight:400;
  }

  .divider-outer{
    display:flex; align-items:center; gap:10px; margin-bottom:28px;
  }
  .divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a84c);}
  .divider-line.right{background:linear-gradient(90deg,#c9a84c,transparent);}
  .divider-dot{color:#c9a84c;font-size:8px;}

  .qr-instruction{
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color:#7a6a52; margin-bottom:18px;
  }

  .qr-wrapper{
    display:inline-flex; align-items:center; justify-content:center;
    background:#1a1208; padding:16px; border-radius:14px;
    box-shadow:0 6px 24px rgba(26,18,8,.2);
    margin-bottom:28px;
  }
  #qrcode canvas, #qrcode img{display:block;}

  .divider-outer2{
    display:flex; align-items:center; gap:10px; margin-bottom:22px;
  }

  .langs{
    display:flex; justify-content:center; gap:14px; margin-bottom:28px;
  }
  .lang-pill{
    background:#1a1208; color:#fffdf8;
    padding:6px 14px; border-radius:20px;
    font-size:11px; letter-spacing:2px;
    display:flex; align-items:center; gap:6px;
  }
  .lang-pill .flag{font-size:14px;}

  .footer-line{
    font-size:10px; color:#7a6a52; letter-spacing:2px;
    text-transform:uppercase; opacity:.7;
  }

  /* Print styles */
  @media print{
    body{background:white; padding:0;}
    .card{box-shadow:none; border-color:#c9a84c; margin:0 auto;}
    .no-print{display:none!important;}
  }

  /* Print button - hidden when printing */
  .print-btn{
    display:block; margin:28px auto 0;
    background:#1a1208; color:#fffdf8;
    border:none; padding:11px 28px; border-radius:10px;
    font-family:'Jost',sans-serif; font-size:13px;
    letter-spacing:1px; cursor:pointer; transition:background .25s;
  }
  .print-btn:hover{background:#2a2010;}
</style>
</head>
<body>

<div class="card">
  <p class="top-ornament">✦ &nbsp; restaurante &nbsp; ✦</p>
  <h1 class="brand">Tólinhas</h1>
  <p class="brand-italic">menu do dia</p>

  <div class="divider-outer">
    <div class="divider-line"></div>
    <span class="divider-dot">◆</span>
    <div class="divider-line right"></div>
  </div>

  <p class="qr-instruction">aponte a câmara para o código</p>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <div class="divider-outer2">
    <div class="divider-line"></div>
    <span class="divider-dot">◆</span>
    <div class="divider-line right"></div>
  </div>

  <div class="langs">
    <span class="lang-pill"><span class="flag">🇵🇹</span> PT</span>
    <span class="lang-pill"><span class="flag">🇫🇷</span> FR</span>
    <span class="lang-pill"><span class="flag">🇬🇧</span> EN</span>
  </div>

  <p class="footer-line">menu disponível em 3 idiomas</p>

  <button class="print-btn no-print" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
</div>

<script>
// O QR code aponta para o index.html na mesma pasta
const menuURL = 'https://restaurante-tolinhas.netlify.app';

window.addEventListener('DOMContentLoaded', () => {
  new QRCode(document.getElementById('qrcode'), {
    text: menuURL,
    width: 200, height: 200,
    colorDark: '#fffdf8',
    colorLight: '#1a1208',
    correctLevel: QRCode.CorrectLevel.M
  });
});
</script>
</body>
</html>
